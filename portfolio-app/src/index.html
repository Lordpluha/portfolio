<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vladyslav Tesliuk — Senior Frontend Engineer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Portfolio of Vladyslav Tesliuk, senior frontend engineer: twenty projects across products, landing pages, markup and build tooling."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#100f0d" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="favicon.ico" sizes="32x32" />
    <script>
      // Paint the stored theme before first paint so there is no flash. Kept
      // inline and tiny on purpose; localStorage throws in some contexts.
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
