server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Build output is content-hashed, so it can be cached forever.
    location ~* -[A-Z0-9]{8}\.(?:js|css)$ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:woff2|webp|png|jpg|jpeg|svg|ico)$ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Every route is prerendered to its own index.html, so the SPA fallback only
    # catches addresses that have no file at all — the router then renders the
    # designed 404 page. Swap the last entry for `=404` plus
    # `error_page 404 /404.html;` if you would rather return a real 404 status.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html /index.html;
    }
}
